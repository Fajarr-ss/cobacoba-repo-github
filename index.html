<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Game Sigma - Tangkap Fajrie</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background: #111; color: white; text-align: center; overflow: hidden; height: 100vh; }
  #header { padding: 15px; }
  h1 { font-size: 22px; margin-bottom: 5px; }
  #score { font-size: 28px; color: #00ff88; font-weight: bold; }
  #time { font-size: 16px; color: #ffcc00; margin-top: 4px; }
  #gameArea {
    position: relative;
    width: 100%;
    height: 68vh;
    background: #1a1a1a;
    border-top: 2px solid #333;
    border-bottom: 2px solid #333;
    overflow: hidden;
  }
  .item {
    position: absolute;
    font-size: 46px;
    cursor: pointer;
    user-select: none;
    transition: transform 0.1s;
    padding: 5px;
  }
  .item:active { transform: scale(1.3); }
  .btn-start {
    padding: 12px 28px;
    font-size: 18px;
    background: #00ff88;
    color: #111;
    border: none;
    border-radius: 20px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 15px;
  }
  .btn-start:active { transform: scale(0.95); }
  #btn2 {
    padding: 10px 20px;
    background: #444;
    color: white;
    border: none;
    border-radius: 15px;
    margin-top: 10px;
    cursor: pointer;
  }
  #over {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.9);
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 10;
    padding: 20px;
  }
  #over h2 { font-size: 36px; color: #ff4444; margin-bottom: 10px; }
  #over p { font-size: 20px; margin: 8px 0; }
</style>
</head>
<body>

<div id="header">
  <h1>🎮 GAME SIGMA: TANGKAP FAJRIE</h1>
  <div>Skor: <span id="score">67</span></div>
  <div id="time">Waktu: 120 detik | Nyawa: 😹😹😹😹</div>
</div>

<div id="gameArea"></div>

<button id="btn" class="btn-start" onclick="startGame()">🍑 GASSKE</button>
<br>
<button id="btn2" onclick="location.reload()">💩 Baleni</button>

<div id="over">
  <h2>KROCOO!</h2>
  <p id="finalScore"></p>
  <p id="pesan"></p>
  <button class="btn-start" onclick="location.reload()">Main Lagi</button>
</div>

<script>
let score = 67;
let nyawa = 4;
let waktu = 120;
let gameJalan = false;
let intervalWaktu, intervalSpawn;

const gameArea = document.getElementById('gameArea');

// Daftar item: ikon, poin, dan status apakah bom/zonk
const daftarItem = [
  { emoji: '😎', poin: 10, jenis: 'target' }, // Fajrie Sigma
  { emoji: '🗿', poin: 15, jenis: 'target' }, // Sigma bonus
  { emoji: '🍑', poin: 20, jenis: 'target' }, // Super bonus
  { emoji: '💩', poin: -15, jenis: 'bom' },   // Zonk kurangi nyawa
  { emoji: '💣', poin: -20, jenis: 'bom' }    // Bom kurangi nyawa
];

function updateUI() {
  document.getElementById('score').innerText = score;
  let hati = nyawa > 0 ? '😹'.repeat(nyawa) : '💀';
  document.getElementById('time').innerText = `Waktu: ${waktu} detik | Nyawa: ${hati}`;
}

function startGame() {
  if (gameJalan) return;
  gameJalan = true;
  score = 67;
  nyawa = 4;
  waktu = 120;
  gameArea.innerHTML = '';

  updateUI();
  document.getElementById('btn').style.display = 'none';
  document.getElementById('over').style.display = 'none';

  // Timer mundur tiap 1 detik
  intervalWaktu = setInterval(() => {
    waktu--;
    updateUI();
    if (waktu <= 0) {
      gameOver('Waktu habis bro!');
    }
  }, 1000);

  // Munculkan item baru tiap 700 milidetik
  intervalSpawn = setInterval(spawnItem, 700);
}

function spawnItem() {
  if (!gameJalan) return;

  const data = daftarItem[Math.floor(Math.random() * daftarItem.length)];
  const el = document.createElement('div');
  el.className = 'item';
  el.innerText = data.emoji;

  // Posisi horizontal acak
  const maxX = gameArea.clientWidth - 60;
  const posX = Math.max(10, Math.floor(Math.random() * maxX));
  let posY = -50;

  el.style.left = posX + 'px';
  el.style.top = posY + 'px';
  gameArea.appendChild(el);

  // Kecepatan jatuh acak
  const kecepatan = 3 + Math.random() * 3;
  let tertangkap = false;

  // Event saat diklik atau disentuh di HP
  const tangkap = (e) => {
    e.preventDefault();
    if (!gameJalan || tertangkap) return;
    tertangkap = true;

    if (data.jenis === 'bom') {
      nyawa--;
      score = Math.max(0, score + data.poin);
    } else {
      score += data.poin;
    }

    updateUI();
    el.remove();

    if (nyawa <= 0) {
      gameOver('Nyawamu entek kena jebakan!');
    }
  };

  el.addEventListener('mousedown', tangkap);
  el.addEventListener('touchstart', tangkap);

  // Animasi jatuh ke bawah
  const jatuh = setInterval(() => {
    if (!gameJalan || tertangkap) {
      clearInterval(jatuh);
      return;
    }

    posY += kecepatan;
    el.style.top = posY + 'px';

    // Jika melewati batas bawah area game
    if (posY > gameArea.clientHeight) {
      clearInterval(jatuh);
      el.remove();

      // Jika target sigma lolos tidak tertangkap, nyawa berkurang 1
      if (data.jenis === 'target' && gameJalan) {
        nyawa--;
        updateUI();
        if (nyawa <= 0) {
          gameOver('Fajrie kabur terus, nyawa habis!');
        }
      }
    }
  }, 20);
}

function gameOver(alasan) {
  gameJalan = false;
  clearInterval(intervalWaktu);
  clearInterval(intervalSpawn);

  document.getElementById('finalScore').innerText = `Skor Akhir: ${score}`;
  document.getElementById('pesan').innerText = alasan;
  document.getElementById('over').style.display = 'flex';
}
</script>

</body>
</html>
