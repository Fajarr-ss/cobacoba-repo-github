<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Night Toggle - dari Video</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    /* background transparan kayak di video lu */
    background: transparent;
    background-image:
      linear-gradient(45deg, #eee 25%, transparent 25%),
      linear-gradient(-45deg, #eee 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #eee 75%),
      linear-gradient(-45deg, transparent 75%, #eee 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    font-family: sans-serif;
  }

  /* ===== TOGGLE UTAMA ===== */
  .toggle{
    position:relative;
    width:260px;
    height:110px;
    display:block;
    cursor:pointer;
  }
  .toggle input{display:none}

  .track{
    position:absolute;
    inset:0;
    background:#3d3d3d;
    border-radius:999px;
    border:3px solid #111;
    box-shadow: 0 8px 20px rgba(0,0,0,.35), inset 0 2px 6px rgba(0,0,0,.4);
    overflow:hidden;
    transition:.5s;
  }

  /* ===== KNOB PUTIH ===== */
  .knob{
    position:absolute;
    top:9px;
    left:9px;
    width:88px;
    height:88px;
    background:#fff;
    border-radius:50%;
    box-shadow: 0 4px 12px rgba(0,0,0,.4);
    transition:.5s cubic-bezier(.68,-0.15,.27,1.15);
    z-index:3;
  }

  /* ===== BINTANG KUNING ===== */
  .star{
    position:absolute;
    color:#ffe45e;
    font-size:26px;
    text-shadow: 0 0 10px #ffe45e;
    transition:.5s;
    z-index:2;
    animation: twinkle 1.5s infinite alternate;
  }
  .star:nth-child(1){ top:16px; left:118px; animation-delay:0s; }
  .star:nth-child(2){ top:14px; left:168px; font-size:30px; animation-delay:.2s; }
  .star:nth-child(3){ top:14px; left:214px; font-size:28px; animation-delay:.4s; }
  .star:nth-child(4){ top:52px; left:118px; font-size:24px; animation-delay:.1s; }

  @keyframes twinkle{
    from{ transform:scale(1); opacity:1; }
    to{ transform:scale(1.25); opacity:.7; }
  }

  /* ===== BULAN ===== */
  .moon{
    position:absolute;
    right:18px;
    bottom:12px;
    font-size:38px;
    color:#ffe45e;
    text-shadow: 0 0 12px #ffe45e;
    transform: rotate(-20deg);
    transition:.5s;
    z-index:2;
  }

  /* ===== MATAHARI (pas siang) ===== */
  .sun{
    position:absolute;
    left:20px;
    top:50%;
    transform: translateY(-50%) scale(0);
    font-size:42px;
    transition:.5s cubic-bezier(.68,-0.15,.27,1.15);
    z-index:2;
    filter: drop-shadow(0 0 10px #ffcc00);
  }

  /* ===== KONDISI AKTIF / SIANG ===== */
  .toggle input:checked + .track{
    background:#87ceeb;
    border-color:#4a90c2;
  }
  .toggle input:checked + .track .knob{
    left:158px;
    background:#fff8c5;
    box-shadow: 0 0 20px #ffe45e;
  }
  .toggle input:checked + .track .star,
  .toggle input:checked + .track .moon{
    opacity:0;
    transform: translateY(10px) scale(0);
  }
  .toggle input:checked + .track .sun{
    transform: translateY(-50%) scale(1);
  }

  p{position:fixed;bottom:20px;color:#888;font-size:13px}
</style>
</head>
<body>

<label class="toggle">
  <input type="checkbox" id="mode">
  <div class="track">
    <!-- Bintang -->
    <span class="star">★</span>
    <span class="star">★</span>
    <span class="star">★</span>
    <span class="star">★</span>
    <!-- Bulan -->
    <span class="moon">☾</span>
    <!-- Matahari -->
    <span class="sun">☀️</span>
    <!-- Knob -->
    <span class="knob"></span>
  </div>
</label>

<p>Klik toggle-nya buat ganti malam / siang</p>

<script>
  // Biar background body ikut ganti pas di-klik (opsional)
  const cb = document.getElementById('mode');
  cb.addEventListener('change', () => {
    document.body.style.backgroundColor = cb.checked ? '#fff' : 'transparent';
  });
</script>

</body>
</html>
